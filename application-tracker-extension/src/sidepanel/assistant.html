<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>申请助手</title><link rel="stylesheet" href="./assistant.css"></head>
<body>
  <header class="masthead"><div><span class="eyebrow">APPLICATION TRACKER</span><h1>申请助手</h1></div><span id="connection" class="badge">等待连接</span></header>
  <main>
    <section class="target"><h2 id="targetTitle">在申请页面打开助手</h2><p id="targetUrl"></p><button id="useCurrent" class="text-button">改为当前页面</button><p id="tabNotice" class="notice" hidden></p></section>
    <section class="controls">
      <label>申请语言 <select id="language"><option value="zh">中文</option><option value="en">English</option></select></label>
      <button id="prepare" class="primary">识别并预览</button>
      <p class="hint">① 自动准备答案　② 预览后一次确认填写<br>有有效答案的项目默认选中，无需逐项勾选。</p>
      <div class="links"><a href="../profile/profile.html" target="_blank">个人信息</a><a href="../memory/memory.html" target="_blank">问答记忆</a><a href="../ai/ai.html" target="_blank">AI 设置</a></div>
    </section>
    <p id="message" class="notice" role="status" aria-live="polite">先预览，再点击底部“确认并填写”。助手不会自动提交申请。</p>
    <p id="pageTypeNotice" class="notice" hidden></p>
    <section id="framePermissions" class="notice" aria-label="内嵌表单访问权限" hidden></section>
    <section id="overview" hidden><p id="coverage" class="hint"></p><p id="summary"></p><p id="reviewSummary" class="hint"></p><div class="preview-tools"><label>查看 <select id="filter"><option value="all">全部预览</option><option value="attention">只看需处理</option><option value="ready">已有明确答案</option><option value="review">需要核对</option><option value="missing">缺少资料</option><option value="filled">已填写</option><option value="unsupported">暂不支持</option></select></label><button id="selectAll" class="text-button">全选可填项</button><button id="clearSelection" class="text-button">取消全选</button></div><div class="refresh-actions"><button id="refresh">更新预览，保留修改</button><button id="nextMissing">查看必填缺口</button></div></section>
    <details id="aiDetails" hidden><summary>本次 AI 发送范围</summary><p id="aiDisclosure" class="hint"></p></details>
    <p id="visionStatus" class="notice" hidden></p>
    <section id="questions" aria-label="填写预览"></section>
    <section id="results" hidden><h2>本次填写结果</h2><p id="resultSummary"></p><button id="saveResults">批量保存本次答案</button><div id="resultList"></div></section>
    <details id="learning"><summary>学习网页已填写的答案</summary><p class="hint">读取后默认选中可学习的答案，核对后一次确认保存。</p><button id="learn">读取已填写答案</button></details>
    <section id="learnPreview" hidden><h2>核对并保存答案</h2><p class="hint">已默认选中以下答案，可取消不需要的项目。默认仅适用于当前岗位链接。</p><div id="learnList"></div><button id="saveLearned">确认保存选中的答案</button></section>
  </main>
  <footer><button id="fill" class="primary" disabled>确认并填写</button><button id="cancel" hidden>停止</button><button id="undo" disabled>撤销本次填写</button><p class="hint">确认后逐项填入并核验；最终提交由你在网站完成。</p></footer>
  <script type="module" src="./assistant.js"></script>
</body></html>
