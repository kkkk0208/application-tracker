<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>申请助手</title><link rel="stylesheet" href="./assistant.css"></head>
<body>
<header class="bar"><div class="page"><strong id="targetTitle">申请助手</strong><span id="targetUrl"></span></div><div id="barActions"><select id="language" aria-label="申请语言"><option value="zh">中文</option><option value="en">English</option></select><button id="refresh" hidden>更新</button><button id="menuButton" aria-label="更多" aria-expanded="false">⋯</button></div></header>
<nav id="menu" hidden><a href="../profile/profile.html" target="_blank">个人信息</a><a href="../memory/memory.html" target="_blank">问答记忆</a><a href="../ai/ai.html" target="_blank">AI 设置</a><button id="learn">学习网页答案</button><button id="useCurrent">改为当前页面</button></nav>
<main>
<p id="message" class="notice" role="status" aria-live="polite">打开网申页后，点“识别本页”。</p>
<button id="allowPageAccess" hidden>允许读取此站点</button>
<div id="start"><button id="prepare" class="primary">识别本页</button></div>
<section id="overview" hidden><div class="counts"><span id="countFill">将填写 0</span><span id="countAttention">要你看 0</span><span id="countSkip">不填 0</span></div><p id="coverage" class="hint" hidden></p></section>
<p id="tabNotice" class="notice" hidden></p><p id="pageTypeNotice" class="notice" hidden></p>
<section id="framePermissions" class="notice" aria-label="内嵌表单访问权限" hidden></section><p id="visionStatus" class="notice" hidden></p>
<section id="results" hidden><div class="result-strip"><strong id="resultSummary"></strong><button id="undo" disabled>撤销</button></div><div id="resultList"></div><button id="saveResults">保存答案，下次直接用</button><section id="recordCard" class="record-card" aria-label="投递记录草稿" hidden></section></section>
<div id="selectionTools" hidden><button id="selectAll" class="text-button">全选可填项</button><button id="clearSelection" class="text-button">取消全选</button></div>
<section id="questions" aria-label="填写预览"></section><button id="showAll" class="text-button" hidden>展开全部题目</button>
<section id="learnPreview" hidden><h2>核对并保存答案</h2><p class="hint">已默认选中以下答案，可取消不需要的项目。默认仅适用于当前岗位链接。</p><div id="learnList"></div><button id="saveLearned">确认保存选中的答案</button></section>
</main>
<footer><button id="fill" class="primary" disabled hidden>填写</button><button id="cancel" hidden>停止</button><p id="aiNote" class="hint" hidden></p><p class="hint">不会自动提交，最后由你在网站提交。</p></footer>
<script type="module" src="./assistant.js"></script>
</body></html>
